name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: cd server && npm ci

      - name: Run ESLint
        run: cd server && npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: cd server && npm ci

      - name: Run tests
        run: cd server && npm test --if-present
        env:
          NODE_ENV: test
          PORT: 5000
          MONGODB_URI: mongodb://127.0.0.1:27017/cinetrack_test
          JWT_SECRET: ci-test-jwt-secret-minimum-32-chars-ok
          JWT_REFRESH_SECRET: ci-test-refresh-secret-minimum-32-chars-ok
          ADMIN_USERNAME: ci_admin
          ADMIN_PASSWORD: ci_admin_password
          REDIS_URL: redis://127.0.0.1:6379
          TMDB_API_KEY: ''
          CLIENT_URLS: http://localhost:5173
          USE_MOCK: 'true'
          SENTRY_DSN: ''
          LOG_LEVEL: error

